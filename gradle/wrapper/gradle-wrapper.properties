# Gradle wrapper configuration.
#
# NOTE: gradle-wrapper.jar and the gradlew / gradlew.bat scripts are intentionally not
# committed here — the wrapper jar is a binary that could not be fetched in the environment
# this repository was authored in. Android Studio generates all three the first time the
# project is opened, or reproduce them with:
#
#     gradle wrapper --gradle-version 8.11.1
#
# The distributionUrl below is the version everything in this repository was written
# against. Bumping it? Bump the Android Gradle Plugin in gradle/libs.versions.toml in the
# same commit, and re-run ./gradlew :core:testDebugUnitTest before trusting the result.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
