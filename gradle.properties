# BumpPay Gradle configuration.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# ---------------------------------------------------------------------------------------
# Local machine paths. `local.properties` (gitignored) is the correct home for sdk.dir —
# it is intentionally NOT set here so nobody commits their laptop's path.
# ---------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------
# BumpPay runtime configuration.
#
# These are read at build time into BuildConfig (see app/build.gradle.kts).
#
#   HELIUS_API_KEY   Get one free at https://dev.helius.xyz — the app will fall back to
#                    the public devnet RPC if this is blank, which is fine for Phase 1
#                    NFC-only testing but WILL rate-limit under repeated taps.
#
#   BUMPPAY_CLUSTER  devnet | testnet | mainnet-beta
#
# Prefer exporting these in ~/.gradle/gradle.properties or your shell rather than
# committing a real key. A leaked Helius key is a billed key.
# ---------------------------------------------------------------------------------------
BUMPPAY_CLUSTER=devnet
HELIUS_API_KEY=

# ---------------------------------------------------------------------------------------
# Release signing. Populate in ~/.gradle/gradle.properties (NOT in the repo):
#
#   BUMPPAY_STORE_FILE=/absolute/path/to/bumppay-release.jks
#   BUMPPAY_STORE_PASSWORD=...
#   BUMPPAY_KEY_ALIAS=bumppay
#   BUMPPAY_KEY_PASSWORD=...
#
# The publishing CLI rejects debug builds, so `assembleRelease` must produce a signed
# APK. If these are absent, the release variant falls back to the debug signing config
# WITH A WARNING so that `assembleRelease` still runs locally — never ship that artifact.
# ---------------------------------------------------------------------------------------
