# BumpPay Anchor workspace.
#
# Pinned to Anchor 1.2.0. Rationale for 1.2.0 specifically rather than "latest":
#  - 1.0.0 was the first stable major release (April 2026) and dropped the Solana CLI
#    dependency, defaulting to Surfpool/LiteSVM for tests. That is a real improvement, but
#    1.0.0 and 1.0.1 immediately needed patch releases.
#  - 2.0.0-rc.1 exists and is a release candidate. A hackathon is not the place for an RC.
#  - 1.2.0 is the current stable and is what `avm install latest` resolves to.
#
# Verify with `anchor --version` — it must report 1.2.x, and `anchor-lang` in
# programs/bumppay/Cargo.toml must match.

[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
bumppay = "BumpPay111111111111111111111111111111111111"

[programs.devnet]
bumppay = "BumpPay111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
# `anchor keys sync` writes the deployed program id back into declare_id! and this file.
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
